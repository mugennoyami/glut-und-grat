name: GitHub Pages

# Veröffentlicht die Demo-Seite als statischen Export (siehe README, Abschnitt „GitHub Pages“).
# Einmalig nötig: im Repository unter Settings → Pages als Source „GitHub Actions“ wählen.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      - name: Pages konfigurieren
        id: pages
        uses: actions/configure-pages@v5

      - name: Statischen Export bauen
        run: npm run build:pages
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PAGES_SITE_URL: ${{ steps.pages.outputs.base_url }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
